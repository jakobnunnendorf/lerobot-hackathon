[project]
name = "lerobot-hackathon"
version = "0.1.0"
description = "Our team project for the LeRobot physical-AI hackathon in Bilbao"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[all,core-scripts,feetech,smolvla,training]==0.7.0",
    "modal>=1.6.4",
    "torch",
    "torchvision",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
